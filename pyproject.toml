[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biliquill"
version = "0.1.0"
description = "A small quill for long Bilibili videos: subtitles, local GPU transcription, and grounded LLM notes."
readme = "README.md"
requires-python = ">=3.11"
license = "Unlicense"
license-files = ["LICENSE"]
dependencies = ["yt-dlp>=2025.1", "httpx>=0.27,<1"]

[project.optional-dependencies]
asr = ["faster-whisper>=1.2,<2", "av>=13,<17", "opencc-python-reimplemented>=0.1.7"]
gpu = [
  "biliquill[asr]",
  "nvidia-cublas-cu12>=12,<13; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "nvidia-cudnn-cu12>=9,<10; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.scripts]
biliquill = "biliquill.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[project.urls]
Repository = "https://github.com/Ceskoslov/biliquill"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
